name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Reading the run's own artifacts back (the wait below) needs this.
  actions: read

# Never let two deploys race. GitHub Pages only serves one artifact at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build first: it prerenders every route, and the render test below audits
      # those files (unique titles, canonicals) as part of the gates.
      - name: Build + verify no API keys
        run: npm run build

      # Script unit tests (brand probe, Drive sync) + server-render of every route
      # at the real base path + prerender audit when dist/ exists.
      - name: Test
        run: npm test

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The artifact list is eventually consistent. `upload-pages-artifact`
      # finalises the upload and `deploy-pages` reads it back a few hundred
      # milliseconds later — and if the list has not caught up yet, the deploy
      # fails with "No artifacts named \"github-pages\" were found" even though
      # the artifact exists and the build is fine. Wait for it to become
      # visible instead of failing the run. (Seen on run 44896951484, 2026-11-21.)
      - name: Wait for the pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 36); do
            id=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '.artifacts[] | select(.name == "github-pages") | .id' | head -n1)
            if [ -n "$id" ]; then
              echo "Artifact github-pages is listed (id $id)."
              exit 0
            fi
            echo "Artifact not listed yet (attempt $i/36) — waiting."
            sleep 5
          done
          echo "::error::The github-pages artifact never appeared for this run."
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
