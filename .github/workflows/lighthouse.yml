name: Lighthouse CI

# Records the performance budgets from the enhancement brief (§2.4) against the
# built site, on mobile emulation. Baseline phase: most assertions are `warn`
# so the numbers are visible without blocking; they flip to `error` once the
# remaining first-load work (per-repo data slimming) lands. CLS is enforced
# already — aspect boxes should keep it near zero.
on:
  pull_request:
    paths: ["src/**", "index.html", "lighthouserc.json", ".github/workflows/lighthouse.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lhci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # LHCI is pointed at five representative routes over vite preview: the
      # staticDistDir discovery would audit all 67 prerendered pages and blow
      # the CI timeout. The build runs for a root base path because vite preview
      # serves dist/ at the root under BASE_PATH=/.
      - name: Build (root base path)
        run: npm run build
        env:
          BASE_PATH: /

      - name: Serve
        run: |
          npx vite preview --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://localhost:4173/ >/dev/null && break; sleep 1; done
        env:
          BASE_PATH: /

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.x autorun
