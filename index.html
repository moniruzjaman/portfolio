    <meta name="theme-color" content="#f7f3ec" />
    <script>
      // Theme boot — runs before first paint so a dark-preference visitor
      // never sees a white flash. System preference by default; a manual
      // choice (ThemeToggle) persists in localStorage and wins.
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem("theme");
          dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        if (dark) {
          document.documentElement.classList.add("dark");
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", "#061a10");
        }
      })();
    </script>
    <link rel="alternate" type="application/atom+xml" href="/feed.xml" title="Writing feed (Atom)" />

    <!-- Fonts: stable URLs under /fonts/ (works at any base path). The preloads
         are the body font every page needs and the display font all headings
         use — without the latter, its swap reflows long headings after first
         paint and breaks the CLS budget (measured 0.055 on note pages under
         Lighthouse mobile throttling). -->
    <link
      rel="preload"
      href="/fonts/dm-sans-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/playfair-display-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/playfair-display-latin-wght-italic.woff2"

      crossorigin
    />
    <link rel="stylesheet" href="/fonts/fonts.css" />
