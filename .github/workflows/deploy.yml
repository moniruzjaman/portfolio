name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. GitHub Pages only serves one artifact at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Build first: it prerenders every route, and the render test below audits
      # those files (unique titles, canonicals) as part of the gates.
      - name: Build + verify no API keys
        run: npm run build

      # Script unit tests (brand probe, Drive sync) + server-render of every route
      # at the real base path + prerender audit when dist/ exists.
      - name: Test
        run: npm test

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # The artifact list is eventually consistent — and `deploy-pages` does not
      # read it over the REST API. It asks the Actions Results Service for the
      # artifacts of *this run and this job*, and that service indexes an
      # upload asynchronously: for a short window after the upload reports
      # success it still answers "no artifacts", while the REST API already
      # lists it. Run 45020962655 (2026-11-21) failed exactly that way — a REST
      # poll found artifact 14754205711 and `deploy-pages` still said
      # "Found 0 artifact(s)".
      #
      # Poll the same service, with the same scope, that deploy-pages will use.
      # When the probe sees the artifact, deploy-pages will find it.
      - name: Wait for the pages artifact
        run: node scripts/wait-for-pages-artifact.mjs github-pages 30 4000

      - id: deployment
        uses: actions/deploy-pages@v5
